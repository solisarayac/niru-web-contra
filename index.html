<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <title>Niru — Recuperar contraseña</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .brand {
      font-size: 52px;
      font-weight: 700;
      font-style: italic;
      color: #C0392B;
      margin-bottom: 32px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1A1A1A;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #888888;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    input {
      width: 100%;
      border: 1px solid #E0E0E0;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      color: #1A1A1A;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #C0392B; }

    .hint {
      font-size: 12px;
      color: #888;
      text-align: left;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      background: #C0392B;
      color: white;
      border: none;
      border-radius: 999px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .message.success { background: #d4edda; color: #27AE60; }
    .message.error { background: #FADBD8; color: #C0392B; }

    .success-state { display: none; }
    .success-state .icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">Niru</div>

    <div id="form-state">
      <div class="title">Nueva contraseña</div>
      <div class="subtitle">Ingresá tu nueva contraseña para recuperar el acceso a tu cuenta.</div>

      <input type="password" id="password" placeholder="Nueva contraseña" />
      <input type="password" id="confirm" placeholder="Confirmar contraseña" />
      <div class="hint">
        Mínimo 8 caracteres, una mayúscula, un número y un carácter especial (!@#$%^&*)
      </div>

      <button id="btn" onclick="handleReset()">Actualizar contraseña</button>
      <div class="message" id="message"></div>
    </div>

    <div class="success-state" id="success-state">
      <div class="icon">✅</div>
      <div class="title">Contraseña actualizada</div>
      <div class="subtitle">Tu contraseña fue cambiada exitosamente. Ya podés iniciar sesión en la app.</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://moutwozdogxbntanciwa.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_nUzZLHBeik9JHCK6Inf0AQ_ZTSu8tK8'
    const { createClient } = supabase
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    // Procesar el token del hash de la URL con logs de depuración
    async function init() {
      console.log('Hash completo:', window.location.hash)
      const hash = window.location.hash
      if (hash && hash.includes('access_token')) {
        const params = new URLSearchParams(hash.substring(1))
        const accessToken = params.get('access_token')
        const refreshToken = params.get('refresh_token')
        console.log('Access token:', accessToken ? 'existe' : 'no existe')
        console.log('Refresh token:', refreshToken ? 'existe' : 'no existe')
        
        if (accessToken && refreshToken) {
          const { data, error } = await client.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken,
          })
          console.log('setSession error:', error)
          console.log('setSession data:', data)
          if (error) {
            showMessage('El link expiró o es inválido. Pedí uno nuevo.', 'error')
            document.getElementById('btn').disabled = true
          }
        }
      } else {
        console.log('No se encontró access_token en el hash')
      }
    }

    function validatePassword(password) {
      if (password.length < 8) return 'Mínimo 8 caracteres'
      if (!/[A-Z]/.test(password)) return 'Debe tener al menos una mayúscula'
      if (!/[0-9]/.test(password)) return 'Debe tener al menos un número'
      if (!/[!@#$%^&*]/.test(password)) return 'Debe tener al menos un carácter especial'
      return null
    }

    function showMessage(text, type) {
      const el = document.getElementById('message')
      el.textContent = text
      el.className = `message ${type}`
      el.style.display = 'block'
    }

    async function handleReset() {
      const password = document.getElementById('password').value
      const confirm = document.getElementById('confirm').value
      const btn = document.getElementById('btn')

      if (!password || !confirm) { showMessage('Completá ambos campos', 'error'); return }
      if (password !== confirm) { showMessage('Las contraseñas no coinciden', 'error'); return }

      const error = validatePassword(password)
      if (error) { showMessage(error, 'error'); return }

      btn.disabled = true
      btn.textContent = 'Actualizando...'

      const { error: updateError } = await client.auth.updateUser({ password })

      if (updateError) {
        showMessage('No se pudo actualizar. Pedí un nuevo link.', 'error')
        btn.disabled = false
        btn.textContent = 'Actualizar contraseña'
      } else {
        document.getElementById('form-state').style.display = 'none'
        document.getElementById('success-state').style.display = 'block'
      }
    }

    init()
  </script>
</body>
</html>
